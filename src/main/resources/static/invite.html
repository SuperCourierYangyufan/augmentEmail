<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 邀请申请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0c0a1d 0%, #1a1333 50%, #0d1b2a 100%);
        }

        /* 动态光斑背景 */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.5) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(234, 67, 53, 0.4) 0%, transparent 70%);
            top: 60%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(251, 188, 5, 0.4) 0%, transparent 70%);
            bottom: -5%;
            left: 30%;
            animation-delay: -10s;
        }

        .orb-4 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(52, 168, 83, 0.4) 0%, transparent 70%);
            top: 20%;
            right: 20%;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.05);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(-30px, -20px) scale(1.02);
            }
        }

        /* 磨玻璃容器 */
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: containerIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.1) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                backdrop-filter: blur(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                backdrop-filter: blur(24px);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-icon::before {
            content: 'G';
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #4285f4 0%, #ea4335 25%, #fbbc05 50%, #34a853 75%, #4285f4 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGradient 4s ease infinite;
        }

        @keyframes logoGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.375rem;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
            font-size: 0.9375rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-input:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-input:focus {
            border-color: rgba(66, 133, 244, 0.6);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-input:disabled {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4285f4 0%, #5e9bff 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.4);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(66, 133, 244, 0.5);
        }

        .btn-primary:hover:not(:disabled)::before {
            opacity: 1;
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary:disabled {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            cursor: not-allowed;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 磨玻璃状态卡片 */
        .status-card {
            padding: 32px 24px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-pending {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.15) 0%, rgba(255, 183, 77, 0.1) 100%);
            border-color: rgba(255, 152, 0, 0.3);
        }

        .status-submitted {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.15) 0%, rgba(100, 181, 246, 0.1) 100%);
            border-color: rgba(33, 150, 243, 0.3);
        }

        .status-invited {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(129, 199, 132, 0.1) 100%);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .status-cancelled {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.15) 0%, rgba(229, 115, 115, 0.1) 100%);
            border-color: rgba(244, 67, 54, 0.3);
        }

        .status-icon {
            font-size: 52px;
            margin-bottom: 16px;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .status-card h3 {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .status-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .email-display {
            background: rgba(0, 0, 0, 0.2);
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
            font-size: 0.9375rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 16px;
            word-break: break-all;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reject-reason {
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(244, 67, 54, 0.15);
            border-radius: 10px;
            color: rgba(255, 150, 150, 0.95);
            font-size: 0.875rem;
            border: 1px solid rgba(244, 67, 54, 0.3);
            text-align: left;
        }

        .reject-reason strong {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: rgba(255, 180, 180, 1);
        }

        .error-message {
            text-align: center;
            padding: 48px 24px;
        }

        .error-message h3 {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.125rem;
            font-weight: 500;
            margin-top: 12px;
        }

        .loading {
            text-align: center;
            padding: 64px 24px;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9375rem;
        }

        .help-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8125rem;
            margin-top: 10px;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 28px 0;
        }

        /* 响应式 */
        @media (max-width: 520px) {
            .container {
                padding: 36px 24px;
                border-radius: 24px;
            }

            .logo-icon {
                width: 64px;
                height: 64px;
            }

            .logo-icon::before {
                font-size: 32px;
            }

            .title {
                font-size: 1.25rem;
            }

            .orb {
                opacity: 0.4;
            }

            .orb-1, .orb-2, .orb-3, .orb-4 {
                width: 250px;
                height: 250px;
            }
        }

        /* 微妙的噪点纹理 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <!-- 动态光斑背景 -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-icon"></div>
            <span class="logo-text">Google 邀请</span>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">正在加载...</div>
            </div>
        </div>
    </div>

    <script>
        // 从 URL 获取邀请码
        const pathParts = window.location.pathname.split('/');
        const inviteCode = pathParts[pathParts.length - 1];

        let currentStatus = null;
        let currentEmail = null;

        // 页面加载时检查邀请码
        document.addEventListener('DOMContentLoaded', () => {
            checkInviteCode();
        });

        // 校验邀请码
        async function checkInviteCode() {
            try {
                const response = await fetch(`/api/invite/check/${inviteCode}`);
                const result = await response.json();

                if (!result.success || !result.data.valid) {
                    showError('邀请链接无效或已过期');
                    return;
                }

                currentStatus = result.data.status;
                currentEmail = result.data.emailAddress;

                renderContent(result.data);

            } catch (error) {
                console.error('校验失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 渲染页面内容
        function renderContent(data) {
            const content = document.getElementById('content');

            if (data.status === 'INVITED') {
                // 已邀请 - 只读查看
                content.innerHTML = `
                    <div class="status-card status-invited">
                        <span class="status-icon">✅</span>
                        <h3>邀请已完成</h3>
                        <p>您的邮箱已成功收到邀请</p>
                        <div class="email-display">${escapeHtml(data.emailAddress)}</div>
                    </div>
                    <p style="text-align: center; color: rgba(255,255,255,0.6); font-size: 0.875rem;">
                        请前往您的邮箱查收邀请邮件
                    </p>
                `;
            } else if (data.status === 'CANCELLED') {
                // 已取消
                content.innerHTML = `
                    <div class="status-card status-cancelled">
                        <span class="status-icon">❌</span>
                        <h3>邀请已取消</h3>
                        <p>此邀请链接已失效</p>
                    </div>
                `;
            } else if (data.status === 'SUBMITTED') {
                // 待邀请 - 可修改
                content.innerHTML = `
                    <div class="status-card status-submitted">
                        <span class="status-icon">⏳</span>
                        <h3>等待邀请中</h3>
                        <p>您的邮箱正在排队等待邀请</p>
                        <div class="email-display">${escapeHtml(data.emailAddress)}</div>
                    </div>
                    <div class="divider"></div>
                    <h2 class="title">修改邮箱</h2>
                    <p class="subtitle">如需更换邮箱地址，请在下方填写</p>
                    <div class="form-group">
                        <label class="form-label">邮箱地址</label>
                        <input type="email" id="emailInput" class="form-input"
                               value="${escapeHtml(data.emailAddress || '')}"
                               placeholder="请输入您的邮箱地址">
                        <p class="help-text">请确保邮箱地址正确无误，邀请将发送至此邮箱</p>
                    </div>
                    <button class="btn btn-primary" onclick="submitEmail()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                        更新邮箱
                    </button>
                `;
            } else {
                // PENDING - 待填写（可能是被驳回后的状态）
                let rejectHtml = '';
                if (data.rejectReason) {
                    rejectHtml = `
                        <div class="status-card status-cancelled" style="margin-bottom: 24px;">
                            <span class="status-icon">⚠️</span>
                            <h3>申请被驳回</h3>
                            <p>请根据以下原因修改后重新提交</p>
                            <div class="reject-reason">
                                <strong>驳回原因</strong>
                                ${escapeHtml(data.rejectReason)}
                            </div>
                        </div>
                    `;
                }
                content.innerHTML = `
                    ${rejectHtml}
                    <h2 class="title">${data.rejectReason ? '重新申请' : '申请 Google 邀请'}</h2>
                    <p class="subtitle">请填写您的邮箱地址，我们将向该邮箱发送邀请</p>
                    <div class="form-group">
                        <label class="form-label">邮箱地址</label>
                        <input type="email" id="emailInput" class="form-input"
                               placeholder="example@gmail.com" autofocus>
                        <p class="help-text">请确保邮箱地址正确无误，邀请将发送至此邮箱</p>
                    </div>
                    <button class="btn btn-primary" onclick="submitEmail()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                        ${data.rejectReason ? '重新提交' : '提交申请'}
                    </button>
                `;
            }
        }

        // 提交/更新邮箱
        async function submitEmail() {
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();

            if (!email) {
                alert('请输入邮箱地址');
                emailInput.focus();
                return;
            }

            // 简单的邮箱格式校验
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('请输入正确的邮箱格式');
                emailInput.focus();
                return;
            }

            const btn = document.querySelector('.btn-primary');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `
                <div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div>
                提交中...
            `;

            try {
                const isUpdate = currentStatus === 'SUBMITTED';
                const url = isUpdate
                    ? `/api/invite/update/${inviteCode}`
                    : `/api/invite/submit/${inviteCode}`;
                const method = isUpdate ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ emailAddress: email })
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message || '提交成功');
                    checkInviteCode(); // 刷新页面状态
                } else {
                    alert(result.message || '提交失败');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }

            } catch (error) {
                console.error('提交失败:', error);
                alert('网络错误，请稍后重试');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        // 显示错误
        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error-message">
                    <span style="font-size: 64px; filter: grayscale(0.3);">😕</span>
                    <h3>${escapeHtml(message)}</h3>
                </div>
            `;
        }

        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
